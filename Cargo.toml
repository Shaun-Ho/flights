[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
flights-core = { path = "crates/core" }
flights-proto = { path = "crates/proto" }
flights-ingestor = { path = "crates/ingestor" }

bytes = "1.11.1"
chrono = "0.4.42"
crossbeam-channel = "0.5.16"
log = "0.4.29"
mcap = "0.25.0"
prost = "0.14.4"
prost-types = "0.14.4"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"

approx = "0.5.1"
rstest = "0.26.1"
test-log = "0.2.19"
testdir = "0.10.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = 0 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }


[package]
name = "flights"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true


[dependencies]
flights-core.workspace = true
flights-ingestor.workspace = true
flights-proto.workspace = true

bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
crossbeam-channel.workspace = true
eframe = "0.36.1"
env_logger = "0.11.11"
log.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
toml.workspace = true
walkers = "0.58.0"
ogn-aprs-parser = "0.2.0"
mcap.workspace = true
schemars = { workspace = true, features = ["chrono04"] }
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true
rstest.workspace = true
test-log.workspace = true
testdir.workspace = true


[lints]
workspace = true
