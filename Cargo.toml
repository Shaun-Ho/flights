[package]
name = "flights"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"


[dependencies]
bytes = "1.11.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
crossbeam-channel = "0.5.16"
eframe = "0.36.1"
env_logger = "0.11.11"
log = "0.4.29"
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
walkers = "0.58.0"
ogn-aprs-parser = "0.2.0"
serde_json = "1.0.151"
mcap = "0.25.0"
schemars = { version = "1.2.2", features = ["chrono04"] }

[dev-dependencies]
approx = "0.5.1"
rstest = "0.26.1"
tempfile = "3.27.0"
test-log = "0.2.21"


[build-dependencies]
glob = "0.3.4"
prost-build = "0.14.4"


[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = 0 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
